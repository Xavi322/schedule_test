name: Update Schedule

on:
  schedule:
    - cron: '15 */2 * * *'  # Автозапуск каждые 2 часа
  workflow_dispatch:        # Кнопка для ручного запуска в любой момент

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Загружаем репозиторий
        uses: actions/checkout@v4

      - name: Ставим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем библиотеки
        run: pip install -r requirements.txt

      - name: Качаем из Облака Mail.ru и собираем index.html
        run: python build.py

      - name: Обновляем сайт, если расписание изменилось
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Автообновление расписания" && git push)
